<html>
    <head>
        <title>My Flask App - Jelly</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 24px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
                background: #f3f6fb;
                color: #1f2937;
            }

            h1 {
                text-align: center;
            }

            form {
                width: min(100%, 420px);
                padding: 28px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(31, 41, 55, 0.1);
            }

            form br {
                display: none;
            }

            label {
                font-weight: 600;
            }

            input,
            button {
                width: 100%;
                padding: 12px;
                font: inherit;
                border-radius: 6px;
            }

            input {
                border: 1px solid #cbd5e1;
            }

            button {
                margin-top: 8px;
                border: 0;
                background: #2563eb;
                color: #fff;
                cursor: pointer;
            }

            button:hover {
                background: #1d4ed8;
            }

            @media (max-width: 480px) {
                body {
                    padding: 16px;
                }

                form {
                    padding: 20px;
                }
            }
        </style>
    </head>
    <body>
        <h1>Welcome to My Flask App - Jelly</h1>
        <form action="/submit" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <button type="submit">Submit</button>
        </form>
    </body>
    
</html>
